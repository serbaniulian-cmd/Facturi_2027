name: Notificari scadente
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
jobs:
  trimite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12 --no-save
      - run: node notifica.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SYNC_COD: ${{ secrets.SYNC_COD }}
